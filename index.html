<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MON DRÔLE PARCOURS CYBER — Niveau 2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070b14;--bg2:#0d1424;--card:#111a2e;--card2:#0f1729;--line:#1e2a44;--line2:#2a3a5c;--txt:#e8eef7;--txt2:#94a3b8;--txt3:#64748b;--cyan:#00d4ff;--cyan2:#5ee0ff;--green:#22c55e;--green2:#4ade80;--gold:#fbbf24;--purple:#a78bfa;--red:#ef4444;--shadow:0 8px 32px rgba(0,0,0,.35)}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#070b14 0%,#0a1220 100%);color:var(--txt);line-height:1.7;font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh}
@media(min-width:768px){body{font-size:16px}}
h1,h2,h3,h4{line-height:1.3;font-weight:700}
h2{font-size:1.5rem;color:var(--txt);margin-bottom:14px}
h3{font-size:1.15rem;color:var(--green2);margin:22px 0 10px}
h4{font-size:1rem;color:var(--cyan2);margin:16px 0 8px}
p{margin:12px 0;color:#cbd5e1}
ul,ol{padding-left:24px;margin:12px 0}
li{margin-bottom:8px;color:#cbd5e1}
strong{color:var(--gold);font-weight:700}
em{color:var(--green2);font-style:normal;font-weight:600}
code{background:#0a1220;padding:2px 8px;border-radius:5px;color:var(--cyan);font-size:.88em;font-family:'JetBrains Mono','Monaco',monospace;border:1px solid var(--line)}
pre{background:#050914;padding:14px;border-radius:8px;overflow-x:auto;font-size:.82em;margin:14px 0;color:var(--cyan2);border:1px solid var(--line);line-height:1.6}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
button{background:linear-gradient(135deg,var(--cyan) 0%,#0098c4 100%);color:#04121b;border:none;padding:12px 22px;border-radius:10px;font-weight:700;cursor:pointer;font-size:.92rem;transition:all .15s ease;font-family:inherit;box-shadow:0 4px 12px rgba(0,212,255,.2)}
button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,212,255,.35)}
button:active{transform:translateY(0)}
button.sec{background:#1a2540;color:var(--txt);box-shadow:none;border:1px solid var(--line2)}
button.sec:hover{background:#232f4d;box-shadow:none}
button.green{background:linear-gradient(135deg,var(--green) 0%,#16a34a 100%);color:#052e16}
button.gold{background:linear-gradient(135deg,var(--gold) 0%,#d97706 100%);color:#1a1200}
button.red{background:linear-gradient(135deg,var(--red) 0%,#b91c1c 100%);color:#fff}
button.print{background:linear-gradient(135deg,var(--purple) 0%,#7c3aed 100%);color:#fff}
header{background:rgba(13,20,36,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:16px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:1rem;font-weight:800;letter-spacing:.3px}
.logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--cyan) 0%,#0098c4 100%);display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 4px 16px rgba(0,212,255,.35)}
.logo .name{color:var(--txt)}
.logo .name span{color:var(--cyan)}
.hs{display:flex;align-items:center;gap:14px;font-size:.82rem;color:var(--txt2);flex-wrap:wrap}
.hs .pill{background:#0f1729;padding:6px 12px;border-radius:20px;border:1px solid var(--line);font-weight:600}
.hs .pill b{color:var(--cyan)}
.hs .logout{cursor:pointer;color:var(--red);font-weight:700;padding:6px 12px;border-radius:8px;transition:background .15s}
.hs .logout:hover{background:rgba(239,68,68,.1);text-decoration:none}
main{max-width:1040px;margin:0 auto;padding:24px 16px 60px}
@media(min-width:768px){main{padding:32px 24px 60px}}
.card{background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);border-radius:16px;padding:26px;margin-bottom:20px;border:1px solid var(--line);box-shadow:var(--shadow)}
@media(max-width:640px){.card{padding:20px}}
.crumb{font-size:.85rem;color:var(--txt3);margin-bottom:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumb a{color:var(--cyan);cursor:pointer}
.intro{background:linear-gradient(135deg,#0c2a44 0%,#082032 100%);padding:18px;border-radius:12px;margin:16px 0;border-left:4px solid var(--cyan);font-style:italic;color:#b8d4e8;font-size:1.02em}
.analogy{background:linear-gradient(135deg,#0d3b4a 0%,#082832 100%);padding:16px;border-radius:12px;margin:16px 0;border-left:4px solid #22d3ee;color:#a5d8e5}
.bank{background:linear-gradient(135deg,#0d3a1f 0%,#052e16 100%);padding:16px;border-radius:10px;margin:16px 0;border-left:4px solid var(--green2);color:#b5e8c8}
.pr{background:linear-gradient(135deg,#0a3a1a 0%,#052e16 100%);padding:16px;border-radius:12px;margin:16px 0;border-left:4px solid var(--green);color:#a7f3c4}
.er{background:linear-gradient(135deg,#3a0f0f 0%,#2a0808 100%);padding:16px;border-radius:10px;margin:16px 0;border-left:4px solid var(--red);color:#f4c4c4}
.df{background:linear-gradient(135deg,#3a2a0a 0%,#2a1f06 100%);padding:16px;border-radius:10px;margin:16px 0;border-left:4px solid var(--gold);color:#f5e3a8}
.svg-box{background:#050914;border-radius:12px;padding:20px;margin:18px 0;text-align:center;border:1px solid var(--line)}
.svg-box svg{max-width:100%;height:auto;display:block;margin:0 auto}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.9em}
th{background:#0f1729;color:var(--cyan);padding:10px;text-align:left;border:1px solid var(--line);font-weight:700}
td{border:1px solid var(--line);padding:10px;color:#cbd5e1}
.quiz{background:#0a1220;padding:20px;border-radius:12px;margin-top:16px;border:1px solid var(--line)}
.q{margin-bottom:20px;padding:14px;background:var(--card2);border-radius:10px;border:1px solid var(--line)}
.q>p:first-child{font-weight:600;margin-bottom:12px;color:#e8eef7;font-size:.98rem}
.q label{display:block;padding:11px 14px;margin:6px 0;background:#111827;border-radius:8px;cursor:pointer;border:1.5px solid transparent;transition:all .15s;color:#cbd5e1;font-size:.92rem}
.q label:hover{background:#1a2540;border-color:var(--line2)}
.q input{margin-right:10px;accent-color:var(--cyan)}
.ok{background:rgba(34,197,94,.15)!important;border-color:var(--green)!important;color:#a7f3c4!important}
.ko{background:rgba(239,68,68,.15)!important;border-color:var(--red)!important;color:#fca5a5!important}
.exp{background:#050914;padding:12px;border-radius:8px;margin-top:10px;font-size:.86em;color:#cbd5e1;border-left:3px solid var(--gold);display:none}
.res{margin-top:16px;padding:16px;border-radius:10px;font-weight:700;text-align:center;font-size:.98rem}
.res.g{background:rgba(34,197,94,.15);color:#a7f3c4;border:1px solid var(--green)}
.res.r{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid var(--red)}
.nav{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.btn{background:var(--card2);padding:16px;border-radius:12px;cursor:pointer;border:2px solid transparent;text-align:left;transition:all .18s ease;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.btn:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,212,255,.15)}
.btn.done{border-color:var(--green);background:linear-gradient(135deg,#0d3a1f 0%,#052e16 100%)}
.btn .n{font-weight:800;color:var(--cyan);display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:1px}
.btn.done .n{color:var(--green2)}
.btn .ti{display:block;font-size:.92rem;color:var(--txt);margin-top:6px;font-weight:600;line-height:1.4}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:18px 0}
.stat{background:linear-gradient(135deg,#111a2e 0%,#0d1424 100%);padding:20px;border-radius:14px;border:1px solid var(--line);text-align:center;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--green))}
.stat .big{font-size:2.2em;font-weight:800;background:linear-gradient(135deg,var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:block;line-height:1.1}
.stat .lbl{font-size:.78em;color:var(--txt2);margin-top:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.progress-bar{background:#0a1220;height:8px;border-radius:4px;overflow:hidden;margin:14px 0;border:1px solid var(--line)}
.progress-bar>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:4px;transition:width .5s ease}
.login-box{max-width:420px;margin:60px auto;background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);padding:36px;border-radius:20px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-box h2{text-align:center;margin-bottom:8px;font-size:1.6rem}
.login-box .sub{text-align:center;color:var(--txt2);font-size:.88rem;margin-bottom:26px;line-height:1.6}
.login-box input{width:100%;padding:14px 16px;margin:8px 0;background:#0a1220;border:1.5px solid var(--line);border-radius:10px;color:var(--txt);font-size:.95rem;font-family:inherit;transition:border-color .15s}
.login-box input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,.1)}
.login-box button{width:100%;margin-top:14px;padding:14px}
.cert-wrapper{background:#0a1220;padding:30px;border-radius:16px;border:1px solid var(--line);margin:20px 0}
.cert-locked{text-align:center;padding:50px 20px;background:linear-gradient(135deg,#0d1424,#0a1220);border-radius:16px;border:2px dashed var(--line2)}
.cert-locked .icon{font-size:4em;margin-bottom:16px;opacity:.6}
.cert-locked h3{color:var(--gold);font-size:1.3rem;margin:0 0 8px}
.cert-locked p{color:var(--txt2);max-width:400px;margin:8px auto}
.cert-locked .progress-small{width:200px;height:6px;background:#0a1220;border-radius:3px;margin:16px auto;overflow:hidden;border:1px solid var(--line)}
.cert-locked .progress-small>div{height:100%;background:linear-gradient(90deg,var(--gold),#d97706);border-radius:3px}
.certificate{background:linear-gradient(135deg,#0a1628 0%,#0d1f3a 50%,#0a1628 100%);padding:40px 30px;border-radius:16px;border:3px double var(--gold);position:relative;overflow:hidden;text-align:center;box-shadow:0 20px 60px rgba(251,191,36,.1);color:#e8eef7}
.certificate::before,.certificate::after{content:'';position:absolute;width:80px;height:80px;border:2px solid var(--gold);opacity:.4}
.certificate::before{top:16px;left:16px;border-right:none;border-bottom:none;border-top-left-radius:16px}
.certificate::after{bottom:16px;right:16px;border-left:none;border-top:none;border-bottom-right-radius:16px}
.certificate .seal{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#d97706);display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto 20px;box-shadow:0 8px 24px rgba(251,191,36,.4);border:3px solid #fde68a}
.certificate .subtitle{color:var(--gold);font-size:.8rem;letter-spacing:3px;text-transform:uppercase;font-weight:800;margin-bottom:8px}
.certificate .title{font-family:'Georgia','Times New Roman',serif;font-size:1.6rem;font-weight:700;color:#fde68a;margin:8px 0 20px;letter-spacing:.5px}
.certificate .certifies{color:#94a3b8;font-size:.9rem;margin:16px 0 8px;font-style:italic}
.certificate .name{font-family:'Georgia','Times New Roman',serif;font-size:2rem;font-weight:700;color:#fff;letter-spacing:1px;padding:16px 0;border-bottom:2px solid var(--gold);border-top:2px solid var(--gold);margin:12px auto 20px;max-width:400px;line-height:1.2}
.certificate .level-title{font-size:1.15rem;font-weight:700;color:var(--green2);margin:16px 0 8px}
.certificate .details{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin:24px 0 20px;font-size:.85rem;color:#94a3b8}
.certificate .details div{text-align:center}
.certificate .details strong{color:var(--cyan);display:block;font-size:1rem;margin-top:4px}
.certificate .cert-id{font-family:'JetBrains Mono','Monaco',monospace;font-size:.72rem;color:#64748b;padding:10px;background:rgba(0,0,0,.3);border-radius:6px;display:inline-block;margin-top:16px}
.certificate .signature{margin-top:30px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px}
.certificate .signature-block{text-align:center;flex:1;min-width:160px}
.certificate .sig-line{border-top:1px solid #94a3b8;padding-top:8px;font-size:.8rem;color:#94a3b8;margin-top:30px}
.certificate .sig-name{font-family:'Georgia',serif;font-style:italic;color:var(--gold);font-size:1.1rem}
.cv-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.cv-container{background:#fff;color:#1a1a1a;border-radius:12px;padding:0;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.cv-page{padding:40px 44px;font-family:'Inter','Segoe UI',sans-serif;line-height:1.55;max-width:820px;margin:0 auto}
.cv-header{border-bottom:3px solid #0c4a6e;padding-bottom:20px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px}
.cv-header .left h1{font-size:2rem;font-weight:800;color:#0c4a6e;letter-spacing:-.5px;line-height:1.1;margin-bottom:4px}
.cv-header .left .role{color:#0369a1;font-size:1.05rem;font-weight:600;margin-bottom:8px}
.cv-header .left .objective{color:#475569;font-size:.88rem;max-width:400px;line-height:1.5;font-style:italic}
.cv-header .right{text-align:right;font-size:.85rem;color:#334155;line-height:1.8}
.cv-header .right b{color:#0c4a6e}
.cv-section{margin-bottom:26px;page-break-inside:avoid}
.cv-section h2{font-size:.95rem;font-weight:800;color:#0c4a6e;text-transform:uppercase;letter-spacing:1.2px;border-bottom:1.5px solid #cbd5e1;padding-bottom:6px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.cv-section h2::before{content:'';width:4px;height:16px;background:#0c4a6e;border-radius:2px;display:inline-block}
.cv-item{margin-bottom:14px}
.cv-item .line1{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.cv-item .title{font-weight:700;color:#0f172a;font-size:.98rem}
.cv-item .date{font-size:.82rem;color:#64748b;font-weight:600}
.cv-item .org{color:#0369a1;font-size:.88rem;font-weight:600;margin-bottom:4px}
.cv-item .desc{font-size:.88rem;color:#475569;line-height:1.6}
.cv-item .desc li{margin-bottom:4px}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:8px}
.skill{font-size:.88rem;margin-bottom:8px}
.skill .name{display:flex;justify-content:space-between;font-weight:600;color:#1e293b;margin-bottom:4px}
.skill .bar{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.skill .bar>div{height:100%;background:linear-gradient(90deg,#0c4a6e,#0369a1);border-radius:3px}
.cv-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cv-badge{padding:4px 10px;background:#e0f2fe;color:#0c4a6e;border-radius:12px;font-size:.78rem;font-weight:700;border:1px solid #bae6fd}
.cv-badge.gold{background:#fef3c7;color:#92400e;border-color:#fde68a}
.cv-badge.green{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.cv-footer{margin-top:30px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:.72rem;color:#94a3b8;text-align:center}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.tab{padding:9px 18px;background:var(--card2);border-radius:10px;cursor:pointer;font-size:.86em;font-weight:600;color:var(--txt2);border:1.5px solid transparent;transition:all .15s}
.tab.active{background:linear-gradient(135deg,var(--cyan),#0098c4);color:#04121b;font-weight:700}
.tab:hover:not(.active){border-color:var(--cyan)}
.certs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:16px}
.cert-item{background:var(--card2);padding:18px;border-radius:12px;border-left:4px solid var(--cyan);display:flex;flex-direction:column;transition:transform .15s}
.cert-item:hover{transform:translateY(-2px)}
.cert-item.free{border-left-color:var(--green)}
.cert-item.paid{border-left-color:var(--gold)}
.cert-item h4{margin:0 0 6px;font-size:.95em;color:var(--txt);line-height:1.35}
.cert-item .org{font-size:.75em;color:var(--txt2);margin-bottom:10px}
.cert-item .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.68em;font-weight:700;margin-right:4px;margin-bottom:4px}
.cert-item .tag.free{background:rgba(34,197,94,.15);color:#86efac}
.cert-item .tag.paid{background:rgba(251,191,36,.15);color:#fde68a}
.cert-item .tag.lvl{background:rgba(59,130,246,.15);color:#93c5fd}
.cert-item .tag.req{background:rgba(168,85,247,.15);color:#d8b4fe}
.cert-item p{font-size:.82em;color:#cbd5e1;margin:8px 0;flex:1;line-height:1.55}
.cert-item .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.cert-item .actions a{flex:1;text-align:center;padding:8px 12px;background:#1a2540;color:var(--cyan);border-radius:8px;font-size:.78em;font-weight:700;text-decoration:none;border:1px solid var(--line2);transition:all .15s}
.cert-item .actions a:hover{background:var(--cyan);color:#04121b}
.cert-item .actions button{padding:8px 12px;font-size:.78em;background:#1a2540;color:var(--txt);border:1px solid var(--line2);box-shadow:none}
.cert-item.done{background:linear-gradient(135deg,#0d3a1f,#052e16);border-left-color:var(--green)}
.cert-item.done .actions button{background:var(--green);color:#052e16}
.jobs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:16px}
.job-item{background:var(--card2);padding:18px;border-radius:12px;border-left:4px solid var(--green);transition:transform .15s}
.job-item:hover{transform:translateY(-2px)}
.job-item h4{margin:0 0 6px;color:var(--green2);font-size:.95em}
.job-item .job-org{font-size:.78em;color:var(--txt2);margin-bottom:8px}
.job-item .job-desc{font-size:.83em;color:#cbd5e1;margin:8px 0;line-height:1.55}
.job-item .job-link{display:inline-block;padding:6px 14px;background:#1a2540;color:var(--cyan);border-radius:8px;font-size:.78em;font-weight:700;text-decoration:none;margin-top:8px;border:1px solid var(--line2)}
.job-item .job-link:hover{background:var(--cyan);color:#04121b}
.exam-card{background:linear-gradient(135deg,#1e1b4b 0%,#0d1424 100%);padding:20px;border-radius:14px;margin:14px 0;border-left:4px solid var(--purple)}
.exam-card h4{color:#ddd6fe;margin:0 0 8px;font-size:1.05rem}
.exam-card.locked{opacity:.55;border-left-color:#475569;background:linear-gradient(135deg,#1a1f2e,#0d1424)}
.exam-card.passed{background:linear-gradient(135deg,#052e16,#031a0d);border-left-color:var(--green)}
.exam-card.passed h4{color:var(--green2)}
.sync-box{background:#0a1220;padding:18px;border-radius:12px;margin:14px 0;border:1px solid var(--line)}
.sync-box textarea{width:100%;min-height:110px;background:#050914;color:var(--cyan);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:'JetBrains Mono',monospace;font-size:.72em;resize:vertical;word-break:break-all;line-height:1.6}
.sync-box label{display:block;margin:10px 0 6px;color:var(--txt2);font-size:.85em;font-weight:600}
.sync-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.today-list{list-style:none;padding:0;margin:12px 0}
.today-list li{padding:12px 14px;background:var(--card2);border-radius:8px;margin-bottom:8px;border-left:3px solid var(--green);font-size:.9em;color:#cbd5e1}
footer{text-align:center;padding:30px 20px;color:var(--txt3);font-size:.82em;font-weight:600;letter-spacing:.5px;border-top:1px solid var(--line);margin-top:40px}
@media print{
  body{background:#fff!important;color:#000!important}
  header,footer,main>.card:not(.printable),.nav,.cv-actions,.cert-actions,main>.card.printable>:not(.cert-wrapper):not(.cv-container){display:none!important}
  main{padding:0!important;max-width:100%!important}
  .card,.cert-wrapper{background:#fff!important;border:none!important;box-shadow:none!important;padding:0!important;margin:0!important}

{id:1,titre:"Les bases des réseaux",
intro:"Un réseau est un ensemble d'équipements connectés qui communiquent. Comprendre les types, topologies et équipements est le point de départ de toute carrière réseau et cyber.",
cours:`
<h3>🌐 Qu'est-ce qu'un réseau ?</h3>
<p>Un <strong>réseau informatique</strong> est un ensemble d'équipements (ordinateurs, serveurs, imprimantes, téléphones) interconnectés pour <em>partager des ressources</em> (fichiers, imprimantes) et <em>communiquer</em> (emails, messagerie, transactions).</p>

<h4>📊 Les types de réseaux par étendue</h4>
<table>
<tr><th>Type</th><th>Signification</th><th>Étendue</th><th>Exemple</th></tr>
<tr><td><strong>PAN</strong></td><td>Personal Area Network</td><td>~10 m</td><td>Bluetooth téléphone-casque</td></tr>
<tr><td><strong>LAN</strong></td><td>Local Area Network</td><td>Un bâtiment</td><td>Réseau d'une agence bancaire</td></tr>
<tr><td><strong>MAN</strong></td><td>Metropolitan Area Network</td><td>Une ville</td><td>Réseau du siège d'une banque à Abidjan</td></tr>
<tr><td><strong>WAN</strong></td><td>Wide Area Network</td><td>Un pays ou plus</td><td>Interconnexion des agences BNI</td></tr>
</table>

<h4>🔗 Les topologies</h4>
<ul>
<li><strong>Étoile</strong> — tous les équipements sont reliés à un switch central. Topologie dominante aujourd'hui. Si un câble tombe, seul le poste concerné est isolé.</li>
<li><strong>Bus</strong> — un seul câble partagé. Obsolète. Un câble coupé = tout le réseau tombe.</li>
<li><strong>Anneau</strong> — chaque équipement est relié au suivant. Utilisé dans les réseaux redondants (fibre optique, FDDI).</li>
<li><strong>Maillée</strong> — chaque équipement est relié à plusieurs autres. Très robuste, coûteux. Utilisée pour les cœurs de réseau bancaire.</li>
</ul>

<h4>🖥️ Les équipements essentiels</h4>
<ul>
<li><strong>Hub</strong> — répète le signal à tous les ports (obsolète). Un seul domaine de collision.</li>
<li><strong>Switch</strong> — intelligent : il apprend les adresses MAC et envoie les trames au bon port. Un domaine de collision par port.</li>
<li><strong>Routeur</strong> — interconnecte des réseaux différents (LAN vers Internet). Travaille sur les adresses IP (couche 3).</li>
<li><strong>Modem</strong> — convertit le signal numérique en signal adapté au support (ADSL, fibre, câble).</li>
<li><strong>Pare-feu</strong> — filtre le trafic entre deux réseaux selon des règles.</li>
</ul>

<div class="analogy">🧠 <strong>Analogie</strong> : imaginez une agence bancaire. Les guichets (PC) sont reliés à un switch central (comme les employés partagent un chef d'agence). Le chef d'agence communique avec les autres agences via le routeur (comme un courrier inter-agences). Le pare-feu à l'entrée filtre les visiteurs (comme un vigile).</div>

<div class="bank">🏦 <strong>Banque CI</strong> : dans une agence BNI, le réseau local (LAN) relie les guichets au serveur d'agence via un switch. Le serveur d'agence se connecte au siège via un routeur et un WAN (fibre ou VPN). Le pare-feu filtre le trafic entre le LAN et le WAN.</div>

<div class="df">⚠️ <strong>Sécurité</strong> : chaque équipement a une surface d'attaque. Un switch mal configuré peut être victime de VLAN hopping. Un routeur sans mot de passe peut être reconfiguré par un attaquant. Un hub (obsolète) diffuse tout le trafic à tous les ports : un attaquant peut écouter tout le réseau.</div>`,
cas:`
<h3>🔧 Cas 1 — Diagnostiquer le réseau d'une agence</h3>
<p><strong>Situation :</strong> une agence bancaire de 12 guichets se plaint de lenteurs et de coupures réseau.</p>
<h4>Étapes</h4>
<ol>
<li>Vérifier la topologie : étoile autour d'un switch central ?</li>
<li>Vérifier le switch : nombre de ports, vitesse (100 Mbps vs 1 Gbps), ventilateur (surchauffe ?)</li>
<li>Vérifier les câbles : catégorie (Cat5e = 1 Gbps, Cat6 = 10 Gbps), longueur (&lt; 100 m)</li>
<li>Vérifier le routeur : connexion WAN, bande passante</li>
<li>Vérifier le pare-feu : logs, règles bloquantes</li>
</ol>
<div class="pr">✅ <strong>Bon réflexe</strong> : documenter la topologie à jour. Une cartographie précise accélère le diagnostic.</div>

<h3>🔧 Cas 2 — Remplacer un hub par un switch</h3>
<p><strong>Situation :</strong> une petite agence utilise encore un hub 10 Mbps. Tous les postes subissent des collisions.</p>
<h4>Pourquoi remplacer</h4>
<ul>
<li>Hub : 1 seul domaine de collision, tout le monde partage 10 Mbps</li>
<li>Switch : chaque port a son propre domaine de collision, 100 Mbps ou 1 Gbps par port</li>
<li>Sécurité : le hub diffuse à tous ; le switch n'envoie qu'au destinataire</li>
</ul>
<div class="pr">✅ <strong>Résultat</strong> : débit ×10 minimum, écoute passive impossible.</div>

<h3>🔧 Cas 3 — Identifier un équipement inconnu</h3>
<p><strong>Situation :</strong> un employé signale un boîtier inconnu branché sur le réseau.</p>
<h4>Analyse</h4>
<ol>
<li>Photographier et noter l'emplacement</li>
<li>Débrancher du réseau (isoler)</li>
<li>Identifier : routeur pirate ? point d'accès Wi-Fi non autorisé ? keylogger réseau ?</li>
<li>Alerter la sécurité SI</li>
<li>Vérifier les logs du switch (port concerné, heure de branchement)</li>
</ol>`,

{id:2,titre:"Le modèle TCP/IP",
intro:"TCP/IP est le modèle réellement utilisé sur Internet. Comprendre ses 4 couches et l'encapsulation est indispensable pour diagnostiquer et sécuriser.",
cours:`
<h3>🧩 Les 4 couches du modèle TCP/IP</h3>
<table>
<tr><th>#</th><th>Couche</th><th>Rôle</th><th>Exemples</th></tr>
<tr><td>4</td><td>Application</td><td>Interface utilisateur</td><td>HTTP, HTTPS, DNS, DHCP, FTP, SSH</td></tr>
<tr><td>3</td><td>Transport</td><td>Segmentation, fiabilité</td><td>TCP, UDP</td></tr>
<tr><td>2</td><td>Internet</td><td>Adressage logique, routage</td><td>IP, ICMP</td></tr>
<tr><td>1</td><td>Accès réseau</td><td>Physique + liaison</td><td>Ethernet, Wi-Fi, câbles</td></tr>
</table>

<h4>🔗 Correspondance avec OSI</h4>
<table>
<tr><th>OSI (7)</th><th>TCP/IP (4)</th></tr>
<tr><td>7 Application, 6 Présentation, 5 Session</td><td>4 Application</td></tr>
<tr><td>4 Transport</td><td>3 Transport</td></tr>
<tr><td>3 Réseau</td><td>2 Internet</td></tr>
<tr><td>2 Liaison, 1 Physique</td><td>1 Accès réseau</td></tr>
</table>

<h4>📦 L'encapsulation</h4>
<p>Quand vous envoyez un message, chaque couche ajoute son propre en-tête :</p>
<ol>
<li><strong>Application</strong> : données (ex : requête HTTP)</li>
<li><strong>Transport</strong> : + en-tête TCP ou UDP (ports source/destination) → <em>segment</em></li>
<li><strong>Internet</strong> : + en-tête IP (adresses IP) → <em>paquet</em></li>
<li><strong>Accès réseau</strong> : + en-tête Ethernet (MAC) → <em>trame</em></li>
</ol>
<p>À la réception, c'est l'inverse (désencapsulation).</p>

<div class="analogy">🧠 <strong>Analogie</strong> : vous envoyez une lettre. Vous écrivez le message (Application), vous le mettez dans une enveloppe avec l'adresse du destinataire (Transport), vous ajoutez l'adresse postale complète (Internet), vous la remettez au facteur (Accès réseau). Le destinataire ouvre l'enveloppe dans l'ordre inverse.</div>

<div class="bank">🏦 <strong>Banque</strong> : une transaction bancaire en ligne passe par HTTPS (Application), TCP (Transport, fiable), IP (Internet) et Ethernet/Wi-Fi (Accès réseau). Un problème sur une couche peut bloquer toute la transaction.</div>

<div class="df">⚠️ <strong>Sécurité</strong> : chaque couche a ses attaques : phishing/SQLi (Application), SYN flood (Transport), IP spoofing (Internet), ARP spoofing (Accès réseau).</div>`,
cas:`
<h3>🔧 Cas 1 — Analyser une capture Wireshark</h3>
<p><strong>Situation :</strong> un analyste capture le trafic d'un poste suspect.</p>
<h4>Lecture de la capture</h4>
<ol>
<li><strong>Frame</strong> (trame) : niveau Accès réseau — adresses MAC</li>
<li><strong>Ethernet II</strong> : type de protocole (IPv4, ARP)</li>
<li><strong>IP</strong> : adresses IP source/destination</li>
<li><strong>TCP/UDP</strong> : ports source/destination, flags</li>
<li><strong>HTTP/DNS</strong> : contenu applicatif</li>
</ol>
<div class="pr">✅ <strong>Réflexe</strong> : lire du bas vers le haut (physique vers application) pour comprendre comment le paquet est construit.</div>

<h3>🔧 Cas 2 — Diagnostiquer une panne couche par couche</h3>
<p><strong>Situation :</strong> un client ne peut pas accéder au site de la banque.</p>
<h4>Méthode</h4>
<ol>
<li><strong>Application</strong> : l'URL est-elle correcte ? (curl, navigateur)</li>
<li><strong>Transport</strong> : le port 443 répond-il ? (<code>nc -zv banque.ci 443</code>)</li>
<li><strong>Internet</strong> : la résolution DNS fonctionne-t-elle ? (<code>ping banque.ci</code>)</li>
<li><strong>Accès réseau</strong> : câble/Wi-Fi OK ? (voyants, ping passerelle)</li>
</ol>

<h3>🔧 Cas 3 — Expliquer une attaque SYN flood</h3>
<p><strong>Principe :</strong> l'attaquant envoie massivement des paquets SYN (demande de connexion) sans jamais terminer le handshake. Le serveur réserve des ressources pour chaque connexion semi-ouverte et sature.</p>
<h4>Protection</h4>
<ul>
<li>SYN cookies (le serveur ne réserve pas avant le ACK final)</li>
<li>Rate limiting (limiter le nombre de SYN par IP)</li>
<li>Pare-feu avec protection DDoS</li>
</ul>`,
quiz:[
{q:"Combien de couches dans TCP/IP ?",o:["3","4","5","7"],c:1,e:"TCP/IP a 4 couches : Application, Transport, Internet, Accès réseau."},

{q:"Quel est l'ordre d'encapsulation ?",o:["Application → Transport → Internet → Accès","Accès → Internet → Transport → Application","Internet → Transport → Application → Accès","Transport → Application → Accès → Internet"],c:0,e:"On part de l'application et on ajoute des en-têtes jusqu'à la couche physique."}

{id:3,titre:"Adressage IP et sous-réseaux",
intro:"L'adresse IP est la plaque d'immatriculation d'un équipement sur le réseau. Savoir la configurer, la masquer et calculer des sous-réseaux est une compétence clé.",
cours:`
<h3>🔢 L'adresse IPv4</h3>
<p>Une adresse IPv4 est composée de <strong>32 bits</strong>, notée en 4 octets décimaux séparés par des points : <code>192.168.1.10</code>.</p>

<h4>📊 Les classes historiques</h4>
<table>
<tr><th>Classe</th><th>Premier octet</th><th>Masque par défaut</th><th>Usage</th></tr>
<tr><td>A</td><td>1-126</td><td>255.0.0.0 (/8)</td><td>Très grands réseaux</td></tr>
<tr><td>B</td><td>128-191</td><td>255.255.0.0 (/16)</td><td>Réseaux moyens</td></tr>
<tr><td>C</td><td>192-223</td><td>255.255.255.0 (/24)</td><td>Petits réseaux</td></tr>
<tr><td>D</td><td>224-239</td><td>—</td><td>Multicast</td></tr>
<tr><td>E</td><td>240-255</td><td>—</td><td>Expérimental</td></tr>
</table>

<h4>🏠 Les adresses privées (RFC 1918)</h4>
<ul>
<li><strong>10.0.0.0/8</strong> — 10.0.0.0 à 10.255.255.255</li>
<li><strong>172.16.0.0/12</strong> — 172.16.0.0 à 172.31.255.255</li>
<li><strong>192.168.0.0/16</strong> — 192.168.0.0 à 192.168.255.255</li>
</ul>
<p>Ces adresses ne sont pas routables sur Internet. Elles sont utilisées dans les LAN (banques, entreprises, maisons).</p>

<h4>🔢 Notation CIDR</h4>
<p><code>192.168.1.10/24</code> signifie : adresse IP = 192.168.1.10, masque = 24 bits à 1 = <code>255.255.255.0</code>.</p>
<table>
<tr><th>CIDR</th><th>Masque</th><th>Nb hôtes</th></tr>
<tr><td>/24</td><td>255.255.255.0</td><td>254</td></tr>
<tr><td>/25</td><td>255.255.255.128</td><td>126</td></tr>
<tr><td>/26</td><td>255.255.255.192</td><td>62</td></tr>
<tr><td>/27</td><td>255.255.255.224</td><td>30</td></tr>
<tr><td>/28</td><td>255.255.255.240</td><td>14</td></tr>
<tr><td>/30</td><td>255.255.255.252</td><td>2</td></tr>
</table>

<h4>🧮 Calcul d'un sous-réseau</h4>
<p>Pour <code>192.168.1.10/24</code> :</p>
<ul>
<li>Adresse réseau : <code>192.168.1.0</code></li>
<li>Adresse broadcast : <code>192.168.1.255</code></li>
<li>Première adresse hôte : <code>192.168.1.1</code></li>
<li>Dernière adresse hôte : <code>192.168.1.254</code></li>
<li>Nombre d'hôtes utilisables : 254</li>
</ul>

<div class="analogy">🧠 <strong>Analogie</strong> : l'adresse IP = l'adresse postale complète. Le masque = ce qui sépare le quartier (réseau) du numéro de rue (hôte). Avec un masque plus long (/26), le quartier est plus petit mais contient plus de quartiers distincts.</div>

<div class="bank">🏦 <strong>Banque</strong> : dans une agence, le réseau est souvent en 192.168.1.0/24. Le serveur d'agence est en 192.168.1.10, la passerelle en 192.168.1.1, les guichets en .20 à .50. Le pare-feu sépare ce réseau du WAN.</div>

<div class="df">⚠️ <strong>Sécurité</strong> : un réseau mal masqué peut provoquer des conflits d'adresses. Un attaquant peut aussi utiliser le DHCP starvation pour épuiser les adresses disponibles.</div>`,
cas:`
<h3>🔧 Cas 1 — Calculer un sous-réseau /26</h3>
<p><strong>Situation :</strong> vous devez découper <code>192.168.10.0/24</code> en 4 sous-réseaux.</p>
<h4>Calcul</h4>
<ol>
<li>4 sous-réseaux = 2 bits supplémentaires (2² = 4)</li>
<li>Nouveau masque : /24 + 2 = /26 = 255.255.255.192</li>
<li>Chaque sous-réseau a 2⁶ = 64 adresses (62 hôtes)</li>
<li>Sous-réseaux : .0, .64, .128, .192</li>
</ol>
<table>
<tr><th>Sous-réseau</th><th>Plage hôtes</th><th>Broadcast</th></tr>
<tr><td>192.168.10.0/26</td><td>.1 à .62</td><td>.63</td></tr>
<tr><td>192.168.10.64/26</td><td>.65 à .126</td><td>.127</td></tr>
<tr><td>192.168.10.128/26</td><td>.129 à .190</td><td>.191</td></tr>
<tr><td>192.168.10.192/26</td><td>.193 à .254</td><td>.255</td></tr>
</table>

<h3>🔧 Cas 2 — Conflit d'adresse IP</h3>
<p><strong>Situation :</strong> un poste affiche « Conflit d'adresse IP détecté ».</p>
<h4>Cause</h4>
<ul>
<li>Deux machines ont la même IP statique</li>
<li>Un serveur DHCP distribue une IP déjà utilisée</li>
<li>Un attaquant a usurpé l'adresse d'un serveur (ARP spoofing)</li>
</ul>
<h4>Résolution</h4>
<ol>
<li><code>ipconfig /all</code> (Windows) ou <code>ip a</code> (Linux) pour vérifier</li>
<li><code>arp -a</code> pour voir les correspondances IP-MAC</li>
<li>Sur le switch : <code>show mac address-table</code> pour trouver le port coupable</li>
<li>Attribuer une IP statique unique ou corriger le DHCP</li>
</ol>

<h3>🔧 Cas 3 — Configurer un poste en IP statique</h3>
<p><strong>Situation :</strong> un serveur d'agence doit avoir une IP fixe <code>192.168.1.10</code>.</p>
<h4>Paramètres</h4>
<ul>
<li>Adresse IP : 192.168.1.10</li>
<li>Masque : 255.255.255.0</li>
<li>Passerelle : 192.168.1.1</li>
<li>DNS : 192.168.1.1 et 8.8.8.8</li>
</ul>
<div class="pr">✅ <strong>Bonne pratique</strong> : réserver la plage .1 à .20 pour les équipements fixes (serveurs, routeurs, imprimantes). Laisser le DHCP distribuer .100 à .200 aux postes clients.</div>`,

{id:4,titre:"Ports et protocoles",
intro:"TCP, UDP et les ports sont le langage des applications sur le réseau. Les connaître par cœur permet de diagnostiquer, sécuriser et détecter des intrusions.",
cours:`
<h3>🔌 TCP vs UDP</h3>
<table>
<tr><th>Critère</th><th>TCP</th><th>UDP</th></tr>
<tr><td>Connexion</td><td>Oui (handshake)</td><td>Non</td></tr>
<tr><td>Fiabilité</td><td>Garantie (acquittements)</td><td>Non garantie</td></tr>
<tr><td>Ordre</td><td>Garanti</td><td>Non garanti</td></tr>
<tr><td>Vitesse</td><td>Plus lent (contrôle)</td><td>Plus rapide</td></tr>
<tr><td>Usage</td><td>Web, email, SSH, FTP</td><td>DNS, DHCP, VoIP, streaming, jeux</td></tr>
</table>

<h4>🤝 Le handshake TCP en 3 étapes</h4>
<ol>
<li><strong>SYN</strong> — le client demande une connexion</li>
<li><strong>SYN-ACK</strong> — le serveur accepte et répond</li>
<li><strong>ACK</strong> — le client confirme</li>
</ol>
<p>Après ça, les données circulent. À la fin : FIN/ACK pour fermer proprement.</p>

<h4>📊 Les ports well-known (0-1023)</h4>
<table>
<tr><th>Port</th><th>Protocole</th><th>Usage</th></tr>
<tr><td>20-21</td><td>FTP</td><td>Transfert de fichiers (non chiffré)</td></tr>
<tr><td>22</td><td>SSH</td><td>Administration sécurisée</td></tr>
<tr><td>23</td><td>Telnet</td><td>Administration non chiffrée (à éviter)</td></tr>
<tr><td>25</td><td>SMTP</td><td>Envoi d'email</td></tr>
<tr><td>53</td><td>DNS</td><td>Résolution de noms</td></tr>
<tr><td>80</td><td>HTTP</td><td>Web (non chiffré)</td></tr>
<tr><td>110</td><td>POP3</td><td>Réception email</td></tr>
<tr><td>143</td><td>IMAP</td><td>Réception email (sync)</td></tr>
<tr><td>443</td><td>HTTPS</td><td>Web sécurisé (TLS)</td></tr>
<tr><td>3306</td><td>MySQL</td><td>Base de données</td></tr>
<tr><td>3389</td><td>RDP</td><td>Bureau à distance Windows</td></tr>
<tr><td>5432</td><td>PostgreSQL</td><td>Base de données</td></tr>
</table>

<div class="analogy">🧠 <strong>Analogie</strong> : l'adresse IP est l'adresse du bâtiment. Le port est le numéro d'appartement. Une adresse IP seule ne suffit pas : il faut le port pour joindre le bon service. <code>142.250.75.238:443</code> = Google en HTTPS.</div>

<div class="bank">🏦 <strong>Banque</strong> : un serveur web bancaire écoute sur 443 (HTTPS). Le serveur de base de données écoute sur 3306 mais NE DOIT PAS être exposé à Internet (uniquement accessible depuis le réseau interne). Un scan nmap externe ne doit voir QUE 443.</div>

<div class="df">⚠️ <strong>Sécurité</strong> : un port ouvert non filtré est une porte d'entrée. Exposer RDP (3389) sur Internet = inviter les attaquants. Règle : fermer tout ce qui n'est pas nécessaire (principe du moindre service).</div>`,
cas:`
<h3>🔧 Cas 1 — Scanner un serveur avec nmap</h3>
<p><strong>Situation :</strong> vous devez vérifier quels ports sont ouverts sur un serveur.</p>
<pre>nmap -sV -p- serveur.banque.ci</pre>
<h4>Lecture</h4>
<ul>
<li><code>-sV</code> : détecter les versions des services</li>
<li><code>-p-</code> : scanner tous les 65535 ports</li>
<li>Résultat : liste des ports ouverts + services</li>
</ul>
<div class="pr">✅ <strong>Analyse</strong> : si vous voyez 22 (SSH), 443 (HTTPS), c'est normal. Si vous voyez 3389 (RDP), 3306 (MySQL) ouverts sur Internet → alerte critique.</div>

<h3>🔧 Cas 2 — Détecter un port suspect</h3>
<p><strong>Situation :</strong> un scan révèle un port 4444 ouvert.</p>
<h4>Analyse</h4>
<ul>
<li>Port 4444 = souvent utilisé par Metasploit (shell inversé)</li>
<li>Vérifier le processus qui écoute : <code>netstat -tulpn</code> (Linux) ou <code>Get-NetTCPConnection</code> (Windows)</li>
<li>Identifier le binaire : <code>lsof -i :4444</code></li>
<li>Si inconnu → compromission probable</li>
</ul>
<div class="er">❌ Isoler immédiatement le serveur, faire un dump forensic, changer les mots de passe.</div>

<h3>🔧 Cas 3 — Sécuriser un serveur web</h3>
<p><strong>Situation :</strong> un serveur bancaire expose par erreur les ports 22, 80, 443, 3306, 3389.</p>
<h4>Bonnes pratiques</h4>
<ul>
<li>Fermer 3306 et 3389 côté Internet (accès via VPN interne uniquement)</li>
<li>Rediriger 80 → 443 (HSTS)</li>
<li>Restreindre 22 aux adresses IP administratives (fail2ban, IP whitelist)</li>
<li>Filtrer avec un pare-feu : <code>iptables</code> ou <code>ufw</code></li>
</ul>`,
quiz:[
{q:"Quel port utilise HTTPS ?",o:["80","443","8080","22"],c:1,e:"HTTPS = 443 (HTTP sécurisé par TLS)."},
{q:"TCP est fiable car ?",o:["Il est plus rapide","Il utilise un handshake et des acquittements","Il est chiffré","Il est gratuit"],c:1,e:"TCP garantit la livraison grâce au handshake en 3 étapes et aux ACK."},
{q:"Exposer RDP (3389) sur Internet = ?",o:["Sûr","Dangereux","Obligatoire","Rapide"],c:1,e:"RDP exposé = cible privilégiée des attaques par force brute. À restreindre via VPN."}
]},

{id:5,titre:"Le DNS en détail",
intro:"Le DNS traduit les noms de domaine en adresses IP. Sans lui, Internet serait inutilisable. Comprendre son fonctionnement permet de diagnostiquer et de détecter des attaques.",
cours:`
<h3>🌍 Le rôle du DNS</h3>
<p>Le <strong>DNS</strong> (<em>Domain Name System</em>) est l'annuaire d'Internet. Il traduit un nom lisible (<code>banque.ci</code>) en adresse IP (<code>196.201.10.20</code>).</p>

<h4>🔄 La résolution</h4>
<ol>
<li><strong>Client</strong> — demande à son résolveur (souvent la box ou le FAI)</li>
<li><strong>Résolveur</strong> — vérifie son cache. Si absent, il interroge les serveurs racine</li>
<li><strong>Serveurs racine</strong> — indiquent le TLD (<code>.ci</code>, <code>.com</code>)</li>
<li><strong>Serveur TLD</strong> — indique le serveur autoritaire du domaine</li>
<li><strong>Serveur autoritaire</strong> — répond avec l'adresse IP</li>
</ol>
<p>Le résolveur met le résultat en cache pour accélérer les prochaines requêtes.</p>

<h4>📋 Types d'enregistrements DNS</h4>
<table>
<tr><th>Type</th><th>Rôle</th></tr>
<tr><td><strong>A</strong></td><td>Nom → IPv4</td></tr>
<tr><td><strong>AAAA</strong></td><td>Nom → IPv6</td></tr>
<tr><td><strong>CNAME</strong></td><td>Alias vers un autre nom</td></tr>
<tr><td><strong>MX</strong></td><td>Serveur email du domaine</td></tr>
<tr><td><strong>NS</strong></td><td>Serveurs DNS autoritaires</td></tr>
<tr><td><strong>TXT</strong></td><td>Informations texte (SPF, DKIM, DMARC)</td></tr>
<tr><td><strong>SOA</strong></td><td>Informations sur la zone</td></tr>
</table>

<div class="analogy">🧠 <strong>Analogie</strong> : le DNS est le répertoire téléphonique d'Internet. Vous connaissez le nom (Banque CI), le DNS vous donne le numéro (IP). Sans lui, vous devriez mémoriser tous les numéros.</div>

<h4>🔐 Attaques DNS</h4>
<ul>
<li><strong>DNS spoofing</strong> — un attaquant modifie la réponse DNS pour rediriger vers un faux site</li>
<li><strong>Cache poisoning</strong> — un attaquant empoisonne le cache du résolveur</li>
<li><strong>DNS tunneling</strong> — exfiltration de données via des requêtes DNS</li>
<li><strong>Typosquatting</strong> — noms de domaine proches (<code>banque-ci.com</code> vs <code>banque.ci</code>)</li>
</ul>

<div class="bank">🏦 <strong>Banque</strong> : dans une banque, les serveurs DNS internes doivent être protégés. Un attaquant qui empoisonne le DNS interne peut rediriger les employés vers de faux sites bancaires et voler leurs identifiants.</div>

<div class="df">⚠️ <strong>Sécurité</strong> : utilisez DNSSEC (signature des réponses DNS) et un résolveur de confiance (1.1.1.1, 8.8.8.8). Vérifiez régulièrement les enregistrements MX et TXT (SPF/DKIM/DMARC) pour éviter l'usurpation d'emails.</div>`,
cas:`
<h3>🔧 Cas 1 — Diagnostiquer une résolution DNS</h3>
<p><strong>Situation :</strong> un utilisateur ne peut pas accéder à <code>banque.ci</code> alors que le site fonctionne.</p>
<h4>Test</h4>
<ol>
<li><code>nslookup banque.ci</code> — le DNS répond-il ?</li>
<li><code>ping 196.201.10.20</code> (IP du site) — si ça ping mais pas le nom, c'est le DNS</li>
<li><code>ipconfig /flushdns</code> (Windows) ou <code>systemd-resolve --flush-caches</code> (Linux)</li>
<li>Changer de DNS : 1.1.1.1 ou 8.8.8.8</li>
</ol>
<div class="pr">✅ <strong>Conclusion</strong> : si le ping IP marche mais pas le nom, le problème est 100 % DNS.</div>

<h3>🔧 Cas 2 — Configurer un domaine</h3>
<p><strong>Situation :</strong> vous devez configurer les DNS d'un domaine <code>banque.ci</code>.</p>
<h4>Enregistrements essentiels</h4>
<ul>
<li><code>A @ 196.201.10.20</code> — le site</li>
<li><code>A www 196.201.10.20</code> — le sous-domaine www</li>
<li><code>MX 10 mail.banque.ci</code> — serveur email</li>
<li><code>TXT "v=spf1 include:_spf.google.com ~all"</code> — SPF anti-usurpation</li>
<li><code>NS ns1.banque.ci</code> — serveurs autoritaires</li>
</ul>

<h3>🔧 Cas 3 — Détecter un typosquatting</h3>
<p><strong>Situation :</strong> des clients reçoivent des emails suspects venant de <code>banque-ci.com</code> au lieu de <code>banque.ci</code>.</p>
<h4>Analyse</h4>
<ul>
<li><code>whois banque-ci.com</code> — date de création (récente = suspect)</li>
<li>Vérifier les enregistrements DNS et MX</li>
<li>Signaler à l'autorité de nommage</li>
<li>Alerter les clients sur le phishing</li>
</ul>`,
quiz:[
{q:"Le DNS sert à ?",o:["Chiffrer les emails","Traduire les noms en IP","Stocker des fichiers","Router les paquets"],c:1,e:"Le DNS traduit les noms de domaine en adresses IP."},
{q:"Quel enregistrement reçoit les emails ?",o:["A","CNAME","MX","TXT"],c:2,e:"MX = Mail eXchanger, serveur email du domaine."},
{q:"Le DNS spoofing consiste à ?",o:["Chiffrer le DNS","Modifier les réponses DNS pour rediriger","Accélérer le DNS","Supprimer le DNS"],c:1,e:"L'attaquant modifie les réponses pour rediriger vers un faux site."}
]},

{id:6,titre:"Le DHCP",
intro:"Le DHCP distribue automatiquement les adresses IP. Indispensable pour ne pas configurer chaque poste à la main. Mais mal protégé, il devient une cible.",
cours:`
<h3>📡 Le rôle du DHCP</h3>
<p>Le <strong>DHCP</strong> (<em>Dynamic Host Configuration Protocol</em>) attribue automatiquement à chaque machine : une adresse IP, un masque, une passerelle, des serveurs DNS.</p>

<h4>🔄 Le processus DORA</h4>
<ol>
<li><strong>D</strong>iscover — le client envoie un broadcast « je cherche un DHCP ! »</li>
<li><strong>O</strong>ffer — le serveur propose une adresse IP</li>
<li><strong>R</strong>equest — le client demande formellement l'adresse</li>
<li><strong>A</strong>cknowledge — le serveur confirme et fixe le bail</li>
</ol>

<h4>⏱️ Le bail DHCP</h4>
<p>Un bail (<em>lease</em>) est une durée pendant laquelle l'adresse est réservée. Par défaut : 24h à 8 jours selon les serveurs. À mi-parcours, le client renouvelle automatiquement.</p>

<h4>🔐 Attaques DHCP</h4>
<ul>
<li><strong>DHCP starvation</strong> — un attaquant envoie massivement des requêtes avec de fausses MAC. Le serveur épuise sa plage d'adresses → déni de service.</li>
<li><strong>Rogue DHCP</strong> — un attaquant installe un faux serveur DHCP qui distribue une passerelle malveillante → interception du trafic (Man-in-the-Middle).</li>
</ul>

<div class="analogy">🧠 <strong>Analogie</strong> : le DHCP est le vestiaire d'un théâtre. Vous arrivez (Discover), on vous propose un ticket (Offer), vous l'acceptez (Request), on vous le donne (Acknowledge). Le bail est la durée avant de rendre le ticket.</div>

<div class="bank">🏦 <strong>Banque</strong> : dans une agence bancaire, le DHCP distribue les adresses aux guichets. Les serveurs et imprimantes ont des IP fixes (réservations DHCP). Le DHCP est restreint au VLAN des postes clients.</div>

<div class="df">⚠️ <strong>Sécurité</strong> : activez le <strong>DHCP snooping</strong> sur les switchs. Seuls les ports autorisés (vers le vrai serveur DHCP) peuvent répondre. Cela bloque les rogue DHCP.</div>`,
cas:`
<h3>🔧 Cas 1 — Poste qui n'obtient pas d'IP</h3>
<p><strong>Situation :</strong> un poste affiche <code>169.254.x.x</code> (APIPA).</p>
<h4>Signification</h4>
<p><strong>APIPA</strong> = le poste n'a pas trouvé de DHCP et s'est auto-attribué une adresse. Il ne peut pas communiquer avec le réseau.</p>
<h4>Résolution</h4>
<ol>
<li><code>ipconfig /release</code> puis <code>ipconfig /renew</code></li>
<li>Vérifier le câble / Wi-Fi</li>
<li>Vérifier que le serveur DHCP est actif</li>
<li>Vérifier que le switch n'a pas de DHCP snooping mal configuré</li>
</ol>

<h3>🔧 Cas 2 — Détecter un rogue DHCP</h3>
<p><strong>Situation :</strong> des postes reçoivent soudainement une passerelle inconnue.</p>
<h4>Signal d'alerte</h4>
<ul>
<li>Passerelle qui n'est pas celle du réseau</li>
<li>DNS inconnu</li>
<li>Trafic qui passe par une IP suspecte</li>
</ul>
<h4>Détection</h4>
<ol>
<li>Sur le switch : <code>show ip dhcp snooping binding</code></li>
<li>Comparer avec la configuration attendue</li>
<li>Identifier le port du rogue DHCP</li>
<li>Désactiver le port et isoler le poste</li>
</ol>

<h3>🔧 Cas 3 — Configurer un DHCP sécurisé</h3>
<p><strong>Bonnes pratiques</strong> :</p>
<ul>
<li>DHCP snooping activé</li>
<li>Un seul serveur DHCP autorisé (trusted port)</li>
<li>Réservations DHCP pour les serveurs et imprimantes</li>
<li>Bail court (2-4h) pour les postes clients</li>
<li>DHCP séparé par VLAN</li>
</ul>`,
quiz:[
{q:"DORA signifie ?",o:["Discover, Offer, Request, Acknowledge","Data, Object, Request, Answer","Dynamic, Object, Route, Access","Discover, Open, Route, Accept"],c:0,e:"DORA = les 4 étapes du DHCP."},
{q:"169.254.x.x signifie ?",o:["Adresse publique","Adresse APIPA (pas de DHCP)","Adresse de broadcast","Adresse de loopback"],c:1,e:"APIPA = le poste n'a pas trouvé de serveur DHCP."},
{q:"Un rogue DHCP permet ?",o:["Accélérer le réseau","Intercepter le trafic (MitM)","Chiffrer les données","Réparer le réseau"],c:1,e:"Un faux serveur DHCP distribue une passerelle malveillante → interception du trafic."}
]},

{id:7,titre:"Le routage",
intro:"Les routeurs interconnectent les réseaux. Comprendre le routage et le NAT permet de diagnostiquer les problèmes d'accès Internet et de sécuriser le périmètre.",
cours:`
<h3>🛣️ Le rôle du routeur</h3>
<p>Un <strong>routeur</strong> interconnecte des réseaux différents. Il consulte une <strong>table de routage</strong> pour décider par où envoyer chaque paquet.</p>

<h4>📋 La table de routage</h4>
<p>Chaque ligne contient :</p>
<ul>
<li><strong>Destination</strong> — réseau cible</li>
<li><strong>Masque</strong> — précision de la route</li>
<li><strong>Passerelle</strong> — prochain saut</li>
<li><strong>Interface</strong> — sortie utilisée</li>
<li><strong>Métrique</strong> — coût de la route</li>
</ul>

<h4>🔀 Les types de routage</h4>
<ul>
<li><strong>Statique</strong> — routes configurées manuellement. Simple, mais ne s'adapte pas aux pannes.</li>
<li><strong>Dynamique</strong> — les routeurs échangent des informations. S'adapte aux pannes.</li>
</ul>

<h4>📡 Protocoles de routage</h4>
<ul>
<li><strong>RIP</strong> — ancien, distance vector (max 15 sauts)</li>
<li><strong>OSPF</strong> — link state, rapide, très utilisé en entreprise</li>
<li><strong>BGP</strong> — protocole d'Internet (entre opérateurs)</li>
</ul>

<h4>🌐 Le NAT (Network Address Translation)</h4>
<p>Le NAT traduit les adresses privées en adresse publique. Une seule IP publique peut faire sortir des milliers de machines privées.</p>
<ul>
<li><strong>SNAT</strong> — Source NAT (masquerade) : le cas le plus courant</li>
<li><strong>DNAT</strong> — Destination NAT (port forwarding) : rediriger un port public vers un serveur interne</li>
</ul>

<div class="analogy">🧠 <strong>Analogie</strong> : le routeur est le standard téléphonique d'une banque. Vous demandez « le service crédit » (destination), le standard vous transfère au bon poste (route). Le NAT, c'est comme un accueil qui donne un seul numéro public pour tous les employés : à l'extérieur, on ne voit que ce numéro.</div>

<div class="bank">🏦 <strong>Banque</strong> : dans une agence, la passerelle par défaut est le routeur. Le NAT traduit les IP privées 192.168.1.x en une IP publique. Le pare-feu filtre. Sans NAT, il faudrait une IP publique par poste (impossible).</div>

<div class="df">⚠️ <strong>Sécurité</strong> : un routeur mal configuré peut exposer des services internes via port forwarding. Vérifiez régulièrement la table NAT et la table de routage.</div>`,
cas:`
<h3>🔧 Cas 1 — Pas d'accès Internet</h3>
<p><strong>Situation :</strong> les postes d'une agence n'ont plus accès à Internet mais le réseau local fonctionne.</p>
<h4>Diagnostic</h4>
<ol>
<li><code>ping 192.168.1.1</code> (passerelle) — répond-elle ?</li>
<li>Si oui, <code>ping 8.8.8.8</code> — sort-on ? Si non, c'est le routeur/FAI</li>
<li>Si oui, <code>nslookup banque.ci</code> — le DNS répond-il ?</li>
<li>Vérifier la table de routage : <code>route print</code> (Windows) ou <code>ip route</code> (Linux)</li>
<li>Vérifier le NAT côté routeur : <code>show ip nat translations</code></li>
</ol>
<div class="pr">✅ <strong>Conclusion</strong> : si le ping IP passe mais pas le DNS, c'est le DNS. Si le ping passerelle échoue, c'est le LAN.</div>

<h3>🔧 Cas 2 — Configurer une route statique</h3>
<p><strong>Situation :</strong> une agence doit joindre un réseau <code>10.20.0.0/16</code> via un routeur <code>192.168.1.254</code>.</p>
<h4>Commande (Linux)</h4>
<pre>ip route add 10.20.0.0/16 via 192.168.1.254</pre>
<h4>Windows</h4>
<pre>route add 10.20.0.0 mask 255.255.0.0 192.168.1.254</pre>

<h3>🔧 Cas 3 — Port forwarding dangereux</h3>
<p><strong>Situation :</strong> un administrateur a fait un port forwarding <code>3389 → 192.168.1.50</code> pour accéder à distance à son PC.</p>
<h4>Risque</h4>
<ul>
<li>RDP exposé sur Internet = cible n°1 des attaques par force brute</li>
<li>Compromission du PC = accès au LAN complet</li>
</ul>
<h4>Solution</h4>
<ul>
<li>Supprimer le port forwarding</li>
<li>Utiliser un VPN (OpenVPN, WireGuard)</li>
<li>Activer MFA sur RDP</li>
<li>Changer les mots de passe</li>
</ul>`,
quiz:[
{q:"Le NAT sert à ?",o:["Chiffrer le trafic","Traduire les IP privées en IP publique","Router les emails","Configurer le DHCP"],c:1,e:"Le NAT permet à plusieurs machines privées de sortir avec une seule IP publique."},
{q:"Quel protocole de routage est utilisé sur Internet ?",o:["RIP","OSPF","BGP","DHCP"],c:2,e:"BGP est le protocole de routage entre opérateurs (Internet)."},
{q:"Exposer RDP sur Internet = ?",o:["Sûr","Dangereux","Obligatoire","Rapide"],c:1,e:"RDP exposé = cible des attaques par force brute. Utiliser un VPN."}
]},

{id:8,titre:"Les switchs et VLAN",
intro:"Les switchs sont au cœur des réseaux locaux. Les VLAN permettent de les segmenter logiquement pour isoler les flux sensibles (banque, RH, invités).",
cours:`
<h3>🔀 Le rôle du switch</h3>
<p>Un <strong>switch</strong> relie les équipements d'un même réseau local. Il apprend les adresses <strong>MAC</strong> et envoie chaque trame uniquement au port concerné.</p>

<h4>🆚 Domaine de collision vs domaine de diffusion</h4>
<ul>
<li><strong>Domaine de collision</strong> — zone où deux trames peuvent entrer en collision. Un switch crée un domaine de collision par port.</li>
<li><strong>Domaine de diffusion</strong> — zone où un broadcast est propagé. Par défaut, tout le switch = un seul domaine de diffusion.</li>
</ul>

<h4>🏷️ Les VLAN (Virtual LAN)</h4>
<p>Un <strong>VLAN</strong> segmente logiquement un switch physique en plusieurs switches virtuels. Chaque VLAN est un domaine de diffusion séparé.</p>
<ul>
<li><strong>VLAN 10</strong> — Postes clients</li>
<li><strong>VLAN 20</strong> — Serveurs</li>
<li><strong>VLAN 30</strong> — Voix (téléphonie IP)</li>
<li><strong>VLAN 99</strong> — Administration</li>
<li><strong>VLAN 100</strong> — Invités</li>
</ul>

<h4>🔗 Les liens trunk</h4>
<p>Un <strong>trunk</strong> transporte plusieurs VLAN sur un même câble (norme 802.1Q). Chaque trame est étiquetée avec son VLAN.</p>

<h4>🔐 Attaques sur les switchs</h4>
<ul>
<li><strong>ARP spoofing</strong> — l'attaquant associe son IP à son MAC dans les tables ARP pour intercepter le trafic</li>
<li><strong>MAC flooding</strong> — saturer la table CAM du switch → il diffuse à tous les ports</li>
<li><strong>VLAN hopping</strong> — passer d'un VLAN à un autre via un double tagging 802.1Q</li>
</ul>

<div class="analogy">🧠 <strong>Analogie</strong> : un switch est un immeuble avec des appartements. Les VLAN sont des étages. Sans VLAN, tous les appartements partagent le même couloir (un broadcast RGPD peut fuiter dans les RH). Avec les VLAN, chaque étage a sa porte sécurisée.</div>

<div class="bank">🏦 <strong>Banque</strong> : dans une agence, on sépare le VLAN des postes clients (192.168.10.0/24) du VLAN de la téléphonie IP (192.168.30.0/24) et du VLAN des serveurs (192.168.20.0/24). Un poste compromis ne peut pas atteindre les serveurs.</div>

<div class="df">⚠️ <strong>Sécurité</strong> : activez <strong>BPDU Guard</strong>, <strong>DHCP snooping</strong>, <strong>Dynamic ARP Inspection</strong> (DAI) et désactivez les ports inutilisés.</div>`,
cas:`
<h3>🔧 Cas 1 — Créer des VLAN</h3>
<p><strong>Situation :</strong> vous devez configurer un switch pour séparer clients, serveurs et invités.</p>
<h4>Configuration Cisco (exemple)</h4>
<pre>vlan 10
 name Clients
vlan 20
 name Serveurs
vlan 100
 name Invites
interface GigabitEthernet0/1
 switchport mode access
 switchport access vlan 10
interface GigabitEthernet0/24
 switchport mode trunk
 switchport trunk allowed vlan 10,20,100</pre>

<h3>🔧 Cas 2 — Détecter un ARP spoofing</h3>
<p><strong>Situation :</strong> plusieurs postes reçoivent des alertes « IP dupliquée ».</p>
<h4>Analyse</h4>
<ol>
<li><code>arp -a</code> sur un poste — deux IP avec le même MAC ?</li>
<li>Sur le switch : <code>show mac address-table</code> — MAC incohérent ?</li>
<li>Activer DAI : <code>ip arp inspection vlan 10</code></li>
<li>Identifier et isoler le port du fraudeur</li>
</ol>
<div class="pr">✅ <strong>Prévention</strong> : DAI + DHCP snooping + port security.</div>

<h3>🔧 Cas 3 — MAC flooding</h3>
<p><strong>Situation :</strong> le switch se met à diffuser à tous les ports (table CAM pleine).</p>
<h4>Cause</h4>
<ul>
<li>Un attaquant envoie des milliers de trames avec des MAC différentes</li>
<li>La table CAM (limitée) sature</li>
<li>Le switch passe en mode « flood » → tout le monde voit tout</li>
</ul>
<h4>Protection</h4>
<ul>
<li>Port security : limiter le nombre de MAC par port</li>
<li><code>switchport port-security maximum 2</code></li>
<li><code>switchport port-security violation shutdown</code></li>
</ul>`,

{id:9,titre:"Wi-Fi et sécurité sans fil",
intro:"Le Wi-Fi est partout, y compris dans les banques. Mais un réseau sans fil mal sécurisé ouvre la porte à toutes les attaques.",
cours:`
<h3>📶 Les normes Wi-Fi</h3>
<table>
<tr><th>Norme</th><th>Fréquence</th><th>Débit max</th></tr>
<tr><td>802.11a</td><td>5 GHz</td><td>54 Mbps</td></tr>
<tr><td>802.11b</td><td>2.4 GHz</td><td>11 Mbps</td></tr>
<tr><td>802.11g</td><td>2.4 GHz</td><td>54 Mbps</td></tr>
<tr><td>802.11n (Wi-Fi 4)</td><td>2.4/5 GHz</td><td>600 Mbps</td></tr>
<tr><td>802.11ac (Wi-Fi 5)</td><td>5 GHz</td><td>3.5 Gbps</td></tr>
<tr><td>802.11ax (Wi-Fi 6)</td><td>2.4/5/6 GHz</td><td>9.6 Gbps</td></tr>
</table>

<h4>🔐 Les protocoles de sécurité</h4>
<table>
<tr><th>Protocole</th><th>Chiffrement</th><th>Statut</th></tr>
<tr><td><strong>WEP</strong></td><td>RC4</td><td>❌ Cassé en minutes</td></tr>
<tr><td><strong>WPA</strong></td><td>TKIP</td><td>⚠️ Obsolète</td></tr>
<tr><td><strong>WPA2</strong></td><td>AES-CCMP</td><td>✅ Standard, mais vulnérable au KRACK</td></tr>
<tr><td><strong>WPA3</strong></td><td>AES-GCMP + SAE</td><td>✅✅ Recommandé</td></tr>
</table>

<h4>🛡️ Le WPS</h4>
<p>Le <strong>WPS</strong> (Wi-Fi Protected Setup) permet de connecter un appareil via un code PIN à 8 chiffres. Vulnérabilité majeure : le PIN peut être cassé en quelques heures par force brute. <strong>Désactivez toujours le WPS</strong>.</p>

<h4>🎯 Attaques Wi-Fi courantes</h4>
<ul>
<li><strong>Evil Twin</strong> — un faux point d'accès imite le SSID légitime → les clients s'y connectent → interception</li>
<li><strong>Rogue AP</strong> — un point d'accès non autorisé installé par un employé</li>
<li><strong>Deauth attack</strong> — déconnexion massive des clients (déni de service)</li>
<li><strong>WPA2 handshake capture + cracking</strong> — capturer le handshake puis le casser hors ligne</li>
</ul>

<div class="analogy">🧠 <strong>Analogie</strong> : le Wi-Fi est une conversation à voix haute dans un lieu public. WEP = chuchotement audible. WPA2 = conversation dans une langue rare. WPA3 = conversation dans une pièce insonorisée. L'evil twin = quelqu'un qui se fait passer pour votre interlocuteur.</div>

<div class="bank">🏦 <strong>Banque</strong> : dans une agence bancaire, le Wi-Fi invité doit être sur un VLAN séparé, avec WPA3, et sans accès au réseau bancaire interne. Le Wi-Fi interne utilise 802.1X + certificat pour chaque poste.</div>

<div class="df">⚠️ <strong>Sécurité</strong> : ne jamais se connecter à un Wi-Fi public sans VPN. Ne jamais activer le WPS. Toujours vérifier le SSID exact (attention aux espaces et caractères).</div>`,
cas:`
<h3>🔧 Cas 1 — Détecter un evil twin</h3>
<p><strong>Situation :</strong> plusieurs employés signalent un Wi-Fi « BNI-WiFi » qui demande un mot de passe.</p>
<h4>Analyse</h4>
<ol>
<li>Comparer le SSID exact et le BSSID (MAC) du vrai point d'accès</li>
<li>Utiliser un outil comme <strong>Wireshark</strong> ou <strong>Kismet</strong> pour scanner les points d'accès</li>
<li>Si un SSID identique existe avec un BSSID inconnu → evil twin</li>
<li>Déconnecter les clients, alerter</li>
</ol>
<div class="pr">✅ <strong>Prévention</strong> : 802.1X (EAP-TLS) avec certificat serveur. L'employé ne peut pas se connecter à un faux AP car le certificat est signé par la banque.</div>

<h3>🔧 Cas 2 — Cracker un WPA2 (test d'intrusion)</h3>
<p><strong>Situation :</strong> dans un pentest autorisé, vous devez évaluer la robustesse du Wi-Fi.</p>
<h4>Étapes</h4>
<ol>
<li>Passer en mode moniteur : <code>airmon-ng start wlan0</code></li>
<li>Capturer le handshake : <code>airodump-ng wlan0mon</code></li>
<li>Déauthentifier un client : <code>aireplay-ng --deauth 5 -a [BSSID] -c [client] wlan0mon</code></li>
<li>Cracker hors ligne : <code>aircrack-ng capture.cap -w wordlist.txt</code></li>
</ol>
<div class="er">❌ Un mot de passe faible = cassé en quelques minutes. Recommandation : minimum 12 caractères, complexe, ou 802.1X.</div>

<h3>🔧 Cas 3 — Sécuriser le Wi-Fi d'une agence</h3>
<p><strong>Bonnes pratiques</strong> :</p>
<ul>
<li>WPA3 ou WPA2-AES (jamais WEP)</li>
<li>WPS désactivé</li>
<li>Wi-Fi invité isolé (VLAN séparé, sans accès interne)</li>
<li>802.1X pour le Wi-Fi interne</li>
<li>Masquer le SSID (fausse sécurité, mais ralentit)</li>
<li>Filtrer les adresses MAC (fausse sécurité, mais utile)</li>
<li>Mises à jour régulières du firmware</li>
</ul>`,

{id:10,titre:"Pare-feu et sécurité réseau",
intro:"Le pare-feu est le gardien du réseau. Il filtre les paquets selon des règles. Bien configuré, il bloque 90 % des attaques basiques.",
cours:`
<h3>🛡️ Le rôle du pare-feu</h3>
<p>Un <strong>pare-feu</strong> (firewall) contrôle le trafic entre deux réseaux en appliquant des règles. Il peut filtrer selon :</p>
<ul>
<li>Adresse IP source/destination</li>
<li>Port source/destination</li>
<li>Protocole (TCP, UDP, ICMP)</li>
<li>État de la connexion (stateful)</li>
</ul>

<h4>🔀 Les types de pare-feu</h4>
<ul>
<li><strong>Filtrage de paquets</strong> — analyse chaque paquet individuellement (couche 3/4). Rapide mais peu intelligent.</li>
<li><strong>Stateful inspection</strong> — garde l'état des connexions (une réponse à une requête sortante est autorisée). Le standard actuel.</li>
<li><strong>Proxy</strong> — analyse le contenu applicatif (couche 7). Plus lent mais plus précis.</li>
<li><strong>NGFW</strong> (Next-Gen Firewall) — combinent filtrage, antivirus, IPS, DPI, contrôle applicatif.</li>
</ul>

<h4>🕵️ IDS / IPS</h4>
<ul>
<li><strong>IDS</strong> — détecte les intrusions et alerte, mais ne bloque pas</li>
<li><strong>IPS</strong> — détecte ET bloque les intrusions</li>
<li>Exemples : Snort, Suricata, Zeek</li>
</ul>

<h4>🏰 La DMZ</h4>
<p>Une <strong>DMZ</strong> (zone démilitarisée) est un sous-réseau isolé entre Internet et le réseau interne. On y place les services accessibles depuis Internet (serveur web, mail) pour éviter qu'un serveur compromis donne accès au LAN.</p>

<h4>📋 Bonnes pratiques</h4>
<ul>
<li><strong>Deny all, allow by exception</strong> — tout est bloqué sauf ce qui est explicitement autorisé</li>
<li>Segmenter : LAN, DMZ, Wi-Fi invités, serveurs</li>
<li>Journaliser : logs conservés 6-12 mois (exigence BCEAO)</li>
<li>Mettre à jour régulièrement les règles</li>
<li>Revoir les règles tous les 6 mois (beaucoup deviennent obsolètes)</li>
</ul>

<div class="analogy">🧠 <strong>Analogie</strong> : le pare-feu est le vigile d'une banque. Il vérifie chaque visiteur selon une liste. La DMZ est le sas d'entrée : les visiteurs y sont contrôlés avant d'entrer dans les salles sensibles. L'IDS est la caméra qui alerte en cas d'anomalie. L'IPS est le vigile qui intervient.</div>

<div class="bank">🏦 <strong>Banque</strong> : dans une banque, le pare-feu est au cœur de la conformité PCI-DSS et BCEAO. Il sépare Internet du LAN, filtre les flux, protège les données de carte bancaire. Les règles doivent être documentées, revues et auditées.</div>

<div class="df">⚠️ <strong>Piège</strong> : un pare-feu mal configuré peut bloquer des flux légitimes (transactions) ou au contraire laisser passer des ports sensibles (3389, 3306). Toujours documenter les règles avec un propriétaire et une date.</div>`,
cas:`
<h3>🔧 Cas 1 — Configurer un pare-feu Linux</h3>
<p><strong>Situation :</strong> un serveur web + SSH doit être accessible depuis Internet.</p>
<pre>ufw default deny incoming
ufw default allow outgoing
ufw allow 22/tcp
ufw allow 80/tcp
ufw allow 443/tcp
ufw enable
ufw status verbose</pre>
<div class="pr">✅ <strong>Principe</strong> : tout est bloqué sauf 22, 80, 443.</div>

<h3>🔧 Cas 2 — Détecter une tentative d'intrusion</h3>
<p><strong>Situation :</strong> les logs du pare-feu montrent des centaines de tentatives sur le port 22 en 10 minutes.</p>
<h4>Analyse</h4>
<ol>
<li>Identifier l'IP source : <code>grep "22" /var/log/ufw.log | awk '{print $11}' | sort | uniq -c</code></li>
<li>Vérifier si l'IP est connue (géolocalisation, réputation)</li>
<li>Décider : bloquer l'IP, activer fail2ban, renforcer les mots de passe</li>
<li>Documenter l'incident</li>
</ol>

<h3>🔧 Cas 3 — Réviser les règles d'un pare-feu</h3>
<p><strong>Situation :</strong> un pare-feu n'a pas été revu depuis 2 ans. Certaines règles sont obsolètes.</p>
<h4>Bonnes pratiques</h4>
<ul>
<li>Lister toutes les règles avec date, auteur, justification</li>
<li>Supprimer celles qui ne servent plus</li>
<li>Fusionner les redondantes</li>
<li>Documenter dans un wiki</li>
<li>Faire signer la revue par le RSSI</li>
</ul>
<div class="pr">✅ <strong>Règle</strong> : une règle sans propriétaire est une règle à supprimer.</div>`,

window.addEventListener('hashchange',route);
function go(h){location.hash=h;}
function route(){
  header();
  if(!state.currentUser){renderLogin();return;}
  if(!isLevelUnlocked(2)){renderLocked();return;}
  var h=(location.hash||'#home').slice(1),p=h.split('/');
  if(p[0]==='home'||p[0]==='')return renderHome();
  if(p[0]==='defi'&&p[1])return renderDefi(parseInt(p[1]));
  if(p[0]==='certif')return renderCertif();
  if(p[0]==='cv')return renderCV();
  if(p[0]==='stats')return renderStats();
  if(p[0]==='jobs')return renderJobs();
  if(p[0]==='examens')return renderExamens();
  if(p[0]==='examen'&&p[1])return renderExamen(p[1]);
  if(p[0]==='certs')return renderCerts();
  if(p[0]==='sync')return renderSync();
  if(p[0]==='login')return renderLogin();
  renderHome();
}

function renderDefi(id){

  var html='<div class="crumb"><a onclick="go(\'home\')">Accueil N2</a> / Défi '+id+'</div>';

  html+='<div class="card"><h2>📖 Cours complet</h2>'+d.cours+'</div>';
  html+='<div class="card"><h2>🔧 Cas pratiques</h2>'+d.cas+'</div>';

  html+='<div class="card"><h2>📝 Quiz de validation</h2><p style="color:#94a3b8;font-size:0.9em">Réponds correctement aux 3 questions pour valider ce défi.</p><div class="quiz">';
  d.quiz.forEach(function(q,i){
    html+='<div class="q" data-i="'+i+'"><p>Q'+(i+1)+'. '+q.q+'</p>';
    q.o.forEach(function(opt,j){
      html+='<label><input type="radio" name="q'+i+'" value="'+j+'"> '+opt+'</label>';
    });
    html+='<div class="exp" id="exp'+i+'">'+q.e+'</div></div>';
  });
  html+='<button onclick="validerQuiz('+id+')">Vérifier mes réponses</button><div id="qr"></div></div></div>';

  html+='<div class="nav">';
  if(id>1)html+='<button class="sec" onclick="go(\'defi/'+(id-1)+'\')">← Précédent</button>';
  if(id<10)html+='<button class="sec" onclick="go(\'defi/'+(id+1)+'\')">Suivant →</button>';
  html+='<button onclick="go(\'home\')">🏠 Accueil</button>';
  if(done)html+='<button class="green">✓ Validé</button>';
  html+='</div>';
  document.getElementById('app').innerHTML=html;
  window.scrollTo(0,0);
}

function validerQuiz(id){
  var d=null;for(var i=0;i<NIVEAU2.length;i++){if(NIVEAU2[i].id===id){d=NIVEAU2[i];break;}}
  if(!d)return;
  var correct=0;
  d.quiz.forEach(function(q,i){
    var sel=document.querySelector('input[name="q'+i+'"]:checked');
    var labels=document.querySelectorAll('.q[data-i="'+i+'"] label');
    labels.forEach(function(l){l.classList.remove('ok','ko');});
    var e=document.getElementById('exp'+i);if(e)e.style.display='block';
    if(sel&&parseInt(sel.value)===q.c){correct++;labels[q.c].classList.add('ok');}
    else{labels[q.c].classList.add('ok');if(sel)labels[parseInt(sel.value)].classList.add('ko');}
  });
  var u=user();
  u.quizScores['2_'+id]={correct:correct,total:d.quiz.length};
  if(correct===d.quiz.length)recordDefi(id);
  save();

  var r=document.getElementById('qr');
  var pass=correct===d.quiz.length;
  r.className='res '+(pass?'g':'r');
  r.textContent=pass?'🎉 '+correct+'/'+d.quiz.length+' — Défi validé !':correct+'/'+d.quiz.length+' — Réessaie';

  if(pass&&id===10){
    if(isLevelComplete(2))setTimeout(function(){alert('🏆 FÉLICITATIONS !\n\nTu as terminé les 10 défis du Niveau 2 !\nTon certificat Niveau 2 est disponible.');},400);
  }
}

  var td=(u.jours&&u.jours[t])?u.jours[t]:{defis:[]};
  var d1=countDoneInLevel(1),d2=countDoneInLevel(2);
  var html='<div class="crumb"><a onclick="go(\'home\')">Accueil N2</a> / Statistiques</div>';
  html+='<div class="card"><h2>📊 '+u.name+'</h2><div class="stats-grid">';
  html+='<div class="stat"><span class="big">'+d1+'</span><span class="lbl">Défis N1</span></div>';
  html+='<div class="stat"><span class="big">'+d2+'</span><span class="lbl">Défis N2</span></div>';
  html+='<div class="stat"><span class="big">'+td.defis.length+'</span><span class="lbl">Aujourd\'hui</span></div>';
  html+='<div class="stat"><span class="big">'+u.certsDone.length+'</span><span class="lbl">Certifications</span></div>';
  html+='</div></div>';
  html+='<div class="card"><h3>🔥 Aujourd\'hui ('+t+')</h3>';
  if(td.defis.length===0)html+='<p style="color:#94a3b8">Aucun défi aujourd\'hui. Lance-toi !</p>';
  else{html+='<ul class="today-list">';td.defis.forEach(function(did){
    var parts=did.split('_');
    var lvl=parts[0],num=parseInt(parts[1]);
    var arr=lvl==='1'?NIVEAU1:NIVEAU2;
    var dd=null;for(var i=0;i<arr.length;i++){if(arr[i].id===num){dd=arr[i];break;}}
    html+='<li>✅ Niveau '+lvl+' · Défi '+num+' : '+(dd?dd.titre:'Défi '+num)+'</li>';
  });html+='</ul>';}
  html+='<div class="nav"><button onclick="go(\'\')">Continuer</button></div></div>';
  html+='<div class="card"><h3>📅 Historique (14 jours)</h3>';
  var jours=u.jours||{},keys=Object.keys(jours).sort().reverse().slice(0,14);
  if(keys.length===0)html+='<p style="color:#94a3b8">Pas encore d\'historique.</p>';
  else keys.forEach(function(k){html+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1e2a44;font-size:.88em"><span>'+k+'</span><span style="color:#22c55e"><b>'+(jours[k].defis?jours[k].defis.length:0)+'</b> défi(s)</span></div>';});

  document.getElementById('app').innerHTML=html;
}

   CERTS
   ============================================================ */
function renderCerts(){
  var u=user();
  var d2=countDoneInLevel(2);
  var html='<div class="crumb"><a onclick="go(\'home\')">Accueil N2</a> / Certifications</div>';
  html+='<div class="card"><h2>🎓 Certifications cyber</h2><p style="color:#94a3b8;font-size:.9em">Chaque certification a un prérequis en nombre de défis Niveau 2. Le badge violet indique le prérequis.</p><div class="tabs">';
  html+='<div class="tab active" onclick="filterCerts(this,\'all\')">Toutes</div>';
  html+='<div class="tab" onclick="filterCerts(this,\'free\')">💚 Gratuites</div>';
  html+='<div class="tab" onclick="filterCerts(this,\'paid\')">💛 Payantes</div>';
  html+='<div class="tab" onclick="filterCerts(this,\'unlocked\')">🔓 Débloquées</div>';
  html+='<div class="tab" onclick="filterCerts(this,\'done\')">✅ Obtenues</div>';
  html+='</div><div class="certs-grid">';
  CERTS.forEach(function(c){
    var isD=u.certsDone.indexOf(c.id)!==-1;
    var unlocked=d2>=c.req;
    html+='<div class="cert-item '+(c.free?'free':'paid')+' '+(isD?'done':'')+'" data-t="'+(c.free?'free':'paid')+'" data-d="'+(isD?'1':'0')+'" data-u="'+(unlocked?'1':'0')+'">';
    html+='<h4>'+c.nom+'</h4><div class="org">'+c.org+'</div>';
    html+='<div><span class="tag '+(c.free?'free':'paid')+'">'+(c.free?'GRATUIT':c.prix)+'</span><span class="tag lvl">'+c.niv+'</span><span class="tag lvl">'+c.dur+'</span><span class="tag req">Défi N2 '+c.req+'+</span></div>';
    html+='<p>'+c.desc+'</p><div class="actions">';
    html+='<a href="'+c.lien+'" target="_blank" rel="noopener">Voir ↗</a>';
    html+='<button onclick="toggleCert(\''+c.id+'\')">'+(isD?'✓ Obtenue':'Marquer')+'</button>';
    html+='</div></div>';
  });
  html+='</div></div>';
  document.getElementById('app').innerHTML=html;
}
function filterCerts(el,type){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  document.querySelectorAll('.cert-item').forEach(function(it){
    var m=false;
    if(type==='all')m=true;
    else if(type==='done')m=it.dataset.d==='1';
    else if(type==='unlocked')m=it.dataset.u==='1';
    else m=it.dataset.t===type;
    it.style.display=m?'flex':'none';
  });
}
function toggleCert(id){
  var u=user();if(!u)return;
  var i=u.certsDone.indexOf(id);
  if(i===-1)u.certsDone.push(id);else u.certsDone.splice(i,1);
  save();renderCerts();
}

   EXAMENS

function renderExamens(){
  var u=user();if(!u)return;
  var html='<div class="crumb"><a onclick="go(\'home\')">Accueil N2</a> / Examens</div>';
  html+='<div class="card"><h2>📝 Examens Niveau 2</h2><p style="color:#94a3b8;font-size:0.9em">Partiel : défis 1-5 (60 %). Final : défis 1-10 (80 %).</p></div>';
  ['partiel','final'].forEach(function(type){
    var e=EXAMENS[type];
    var passed=u.examens['2_'+type];
    var ready=e.req.every(function(id){return u.defisDone['2_'+id];});
    var cls='exam-card '+(passed?'passed':ready?'':'locked');
    html+='<div class="'+cls+'"><h4>'+e.titre+'</h4><p style="font-size:0.85em;color:#cbd5e1">'+e.desc+'</p>';
    if(passed)html+='<p style="color:#86efac;font-size:0.85em">✅ Réussi le '+passed+'</p><button class="green" onclick="go(\'examen/'+type+'\')">Refaire</button>';
    else if(ready)html+='<button class="gold" onclick="go(\'examen/'+type+'\')">Passer l\'examen</button>';
    else html+='<p style="color:#fbbf24;font-size:0.82em">🔒 Termine d\'abord les défis N2 : '+e.req.join(', ')+'</p>';
    html+='</div>';
  });
  document.getElementById('app').innerHTML=html;
}

function renderExamen(type){
  var u=user();if(!u)return;
  var e=EXAMENS[type];
  if(!e){go('examens');return;}
  var ready=e.req.every(function(id){return u.defisDone['2_'+id];});
  if(!ready){alert('Valide d abord les defis N2 requis.');go('examens');return;}
  var html='<div class="crumb"><a onclick="go(\'examens\')">Examens N2</a> / '+e.titre+'</div>';
  html+='<div class="card"><h2>'+e.titre+'</h2><p style="color:#94a3b8;font-size:0.85em">'+e.desc+'</p><div class="quiz">';
  e.qs.forEach(function(q,i){
    html+='<div class="q" data-i="'+i+'"><p>Q'+(i+1)+'. '+q.q+'</p>';
    q.o.forEach(function(opt,j){html+='<label><input type="radio" name="ex'+i+'" value="'+j+'"> '+opt+'</label>';});
    html+='<div class="exp" id="exexp'+i+'">'+q.e+'</div></div>';
  });
  html+='<button onclick="validerExamen(\''+type+'\')">Soumettre l\'examen</button><div id="er"></div></div></div>';
  document.getElementById('app').innerHTML=html;
}

function validerExamen(type){
  var u=user();if(!u)return;
  var e=EXAMENS[type];if(!e)return;
  var correct=0;
  e.qs.forEach(function(q,i){
    var sel=document.querySelector('input[name="ex'+i+'"]:checked');
    var labels=document.querySelectorAll('.q[data-i="'+i+'"] label');
    labels.forEach(function(l){l.classList.remove('ok','ko');});
    var ex=document.getElementById('exexp'+i);if(ex)ex.style.display='block';
    if(sel&&parseInt(sel.value)===q.c){correct++;labels[q.c].classList.add('ok');}
    else{labels[q.c].classList.add('ok');if(sel)labels[parseInt(sel.value)].classList.add('ko');}
  });
  var pct=Math.round(correct/e.qs.length*100);
  var req=type==='final'?80:60;
  var pass=pct>=req;
  if(pass){u.examens['2_'+type]=new Date().toISOString().slice(0,10);save();}
  var r=document.getElementById('er');
  r.className='res '+(pass?'g':'r');
  r.textContent=pass?'🎉 Réussi ! '+correct+'/'+e.qs.length+' ('+pct+'%)':correct+'/'+e.qs.length+' ('+pct+'%) — Il faut '+req+' %';
}

function renderSync(){
  var u=user();
  var code=exportCode();
  var html='<div class="crumb"><a onclick="go(\'home\')">Accueil N2</a> / Synchronisation</div>';
  html+='<div class="card"><h2>🌐 Synchronisation</h2><p style="color:#94a3b8;font-size:.9em">Progression sauvegardée localement. Utilise l\'une des 2 méthodes pour la retrouver sur un autre appareil.</p></div>';
  html+='<div class="card"><h3>📋 Méthode 1 : Code</h3><div class="sync-box"><label>Ton code</label><textarea id="so" readonly onclick="this.select()">'+code+'</textarea><div class="sync-actions"><button onclick="copyCode()">📋 Copier</button></div></div>';
  html+='<div class="sync-box"><label>Coller un code</label><textarea id="si" placeholder="Colle ici..."></textarea><div class="sync-actions"><button class="green" onclick="applyCode()">🔄 Restaurer</button></div></div></div>';
  html+='<div class="card"><h3>💾 Méthode 2 : Fichier</h3><p style="color:#94a3b8;font-size:.9em">Télécharge, envoie par email ou WhatsApp, importe sur l\'autre appareil.</p><div class="sync-actions"><button onclick="dlBackup()">⬇️ Télécharger</button><input type="file" id="bf" accept=".json" style="display:none" onchange="readFile(this)"><button class="sec" onclick="document.getElementById(\'bf\').click()">⬆️ Importer</button></div></div>';
  html+='<div class="card"><h3>📊 Tes données</h3><table>';
  if(u){
    var d1=countDoneInLevel(1),d2=countDoneInLevel(2);
    html+='<tr><td>Défis N1</td><td><b>'+d1+'/10</b></td></tr>';
    html+='<tr><td>Défis N2</td><td><b>'+d2+'/10</b></td></tr>';
    html+='<tr><td>Certifications</td><td><b>'+u.certsDone.length+'/'+CERTS.length+'</b></td></tr>';
    html+='<tr><td>Compte créé le</td><td>'+(u.createdAt||'—')+'</td></tr>';
  }
  html+='</table></div>';
  document.getElementById('app').innerHTML=html;
}
function copyCode(){var ta=document.getElementById('so');ta.select();try{document.execCommand('copy');alert('Copié !');}catch(e){alert('Copie manuelle : Ctrl+C');}}
function applyCode(){var c=document.getElementById('si').value;if(!c.trim()){alert('Colle un code.');return;}if(importCode(c)){alert('Restauré !');route();}else alert('Code invalide.');}
